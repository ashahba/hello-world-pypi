name: Release

# Publishes to PyPI with Trusted Publishing (OIDC): no API token or password
# is stored in this repository. Configure the publisher once at
# https://pypi.org/manage/account/publishing/ with:
#   owner: ashahba   repo: hello-world-pypi
#   workflow: release.yml   environment: pypi
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pipx run build
      - run: pipx run twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hello-world-pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # The action defaults to PyPI; TestPyPI has no alias, so give its URL.
          # "/legacy/" is PyPI's current upload endpoint -- the name refers to the
          # upload protocol it emulates, not to deprecation.
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hello-world-pypi
    permissions:
      id-token: write # required for Trusted Publishing + PEP 740 attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
